<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xanter MP3</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #070913;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding: 15px;
            padding-bottom: 130px;
        }
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
        }
        /* Rangi rasmi ya Xanter MP3 (Zambarau na Pink) */
        .logo {
            font-size: 22px;
            font-weight: 800;
            background: linear-gradient(135deg, #a855f7, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .logo span {
            color: #00f2fe;
            -webkit-text-fill-color: #00f2fe;
        }

        .search-container {
            position: relative;
            margin-bottom: 15px;
        }
        .search-box {
            display: flex;
            background: #10162f;
            border-radius: 30px;
            padding: 10px 18px;
            align-items: center;
            border: 1px solid #a855f755;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
        }
        .search-box input {
            flex: 1;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 15px;
            outline: none;
        }
        .search-box button {
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }
        #suggestionsBox {
            position: absolute;
            top: 100%;
            left: 15px;
            right: 15px;
            background: #10162f;
            border: 1px solid #a855f755;
            border-radius: 12px;
            margin-top: 6px;
            max-height: 200px;
            overflow-y: auto;
            z-index: 100;
            display: none;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
        }
        .suggestion-item {
            padding: 12px 16px;
            font-size: 13px;
            color: #cbd5e1;
            cursor: pointer;
            border-bottom: 1px solid #1a2342;
        }
        .suggestion-item:hover {
            background: rgba(168, 85, 247, 0.2);
            color: #fff;
        }

        /* Sehemu ya Arts inayotembea kushoto kwenda kulia */
        .arts-section {
            margin-bottom: 20px;
        }
        .section-title {
            font-size: 15px;
            font-weight: 700;
            color: #a855f7;
            margin-bottom: 10px;
        }
        .arts-slider {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding-bottom: 5px;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }
        .arts-slider::-webkit-scrollbar {
            display: none;
        }
        .art-card {
            min-width: 110px;
            height: 110px;
            background: #10162f;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #1e293b;
            flex-shrink: 0;
            position: relative;
            cursor: pointer;
            transition: 0.2s;
        }
        .art-card:hover {
            border-color: #a855f7;
            transform: scale(1.03);
        }
        .art-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .art-title {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(7, 9, 19, 0.85);
            font-size: 10px;
            padding: 4px;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #fff;
        }

        #resultsContainer {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .track-card {
            background: #10162f;
            padding: 12px 14px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid #1e293b;
            gap: 10px;
            transition: 0.2s;
        }
        .track-card:hover {
            border-color: #a855f7;
            box-shadow: 0 4px 15px rgba(168, 85, 247, 0.2);
        }
        .track-info {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
            min-width: 0;
        }
        .track-info img {
            width: 48px;
            height: 48px;
            border-radius: 10px;
            object-fit: cover;
            flex-shrink: 0;
        }
        .track-details {
            flex: 1;
            min-width: 0;
        }
        .track-details h4 {
            font-size: 13px;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 3px;
            font-weight: 600;
        }
        .track-details p {
            font-size: 11px;
            color: #cbd5e1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .action-btns {
            display: flex;
            gap: 6px;
            align-items: center;
            flex-shrink: 0;
        }
        
        /* Vifungo vya Icons Pekee (Bila Maneno) */
        .btn-cheza {
            background: linear-gradient(135deg, #a855f7, #ec4899);
            color: #ffffff;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-cheza svg {
            width: 15px;
            height: 15px;
            fill: #fff;
        }

        .btn-playlist {
            background: #1e293b;
            color: #a855f7;
            border: 1px solid #a855f7;
            width: 32px;
            height: 32px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-playlist svg {
            width: 14px;
            height: 14px;
            fill: #a855f7;
        }

        .btn-download {
            background: #00897b;
            color: #fff;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-download svg {
            width: 15px;
            height: 15px;
            fill: #fff;
        }

        /* Menu ya Duara yenye Rangi Kuu ya Zambarau/Pink */
        .sci-fi-menu-wrapper {
            position: fixed;
            bottom: 75px;
            right: 0;
            z-index: 999;
        }
        .sci-fi-trigger {
            position: absolute;
            bottom: 10px;
            right: 15px;
            width: 52px;
            height: 52px;
            background: linear-gradient(135deg, #a855f7, #ec4899);
            border-radius: 50%;
            border: 2px solid #00f2fe;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(168, 85, 247, 0.5);
            z-index: 1001;
            transition: 0.3s;
        }
        .sci-fi-trigger:hover {
            transform: scale(1.1);
        }
        .sci-fi-wheel {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 290px;
            height: 290px;
            pointer-events: none;
            display: none;
        }
        .sci-fi-wheel.show {
            display: block;
            pointer-events: auto;
        }
        .sci-sector {
            position: absolute;
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #a855f7, #ec4899);
            border: 2px solid #00f2fe;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            color: #ffffff;
            font-size: 8px;
            font-weight: 700;
            transition: 0.2s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.7);
        }
        .sci-sector svg {
            width: 18px;
            height: 18px;
            fill: #ffffff;
            margin-bottom: 2px;
        }
        .sci-sector:hover, .sci-sector.active {
            background: #7e22ce;
            border-color: #ffffff;
            box-shadow: 0 0 15px rgba(236, 72, 153, 0.8);
            transform: scale(1.1);
        }
        /* Nafasi za duara */
        .sec-home { bottom: 185px; right: 20px; }
        .sec-explore { bottom: 150px; right: 90px; }
        .sec-trending { bottom: 95px; right: 150px; }
        .sec-playlist { bottom: 40px; right: 185px; }
        .sec-download { bottom: 10px; right: 115px; }

        .player-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: linear-gradient(180deg, #10162f 0%, #070913 100%);
            border-top: 2px solid #a855f7;
            padding: 10px 18px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            box-shadow: 0 -10px 30px rgba(168, 85, 247, 0.25);
            z-index: 990;
        }
        .player-info-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .player-title-area {
            font-size: 13px;
            color: #a855f7;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        audio {
            width: 100%;
            height: 35px;
            outline: none;
            filter: invert(1) hue-rotate(240deg) brightness(1.5);
        }
    </style>
</head>
<body onload="loadHomeData()">

    <header>
        <div class="logo">🎵 XANTER <span>MP3</span></div>
    </header>

    <div class="search-container" id="searchSection">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="" oninput="handleSearchInput()">
            <button onclick="searchTracks()">🔍</button>
        </div>
        <div id="suggestionsBox"></div>
    </div>

    <!-- Sehemu ya Arts inayotembea kushoto kwenda kulia -->
    <div id="dynamicContainer">
        <div class="arts-section" id="artsWrapper" style="display:none;">
            <div class="section-title">Featured Arts</div>
            <div class="arts-slider" id="artsSlider"></div>
        </div>
    </div>

    <div id="resultsContainer">
        <p style="text-align:center; color: #94a3b8; margin-top: 25px;">Inapakia nyimbo za Trending...</p>
    </div>

    <!-- Menu ya Duara yenye Rangi Kuu ya Zambarau/Pink -->
    <div class="sci-fi-menu-wrapper">
        <div class="sci-fi-wheel" id="sciWheel">
            <div class="sci-sector sec-home active" onclick="switchTab('home', this)">
                <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
                Home
            </div>
            <div class="sci-sector sec-explore" onclick="switchTab('explore', this)">
                <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
                Explore
            </div>
            <div class="sci-sector sec-trending" onclick="switchTab('trending', this)">
                <svg viewBox="0 0 24 24"><path d="M17.56 21c-.33 0-.67-.09-.96-.28-3.03-1.95-4.49-4.22-5.46-6.19-.66-1.35-1.22-2.5-1.96-3.41-.33-.4-.84-.62-1.37-.62-.05 0-.1 0-.15.01-1.07.11-1.89 1.05-1.89 2.13v.07c0 .87.52 1.65 1.32 1.98.39.16.58.6.42.99-.16.39-.6.58-.99.42C5.55 14.88 4.5 13.56 4.5 12.07v-.07c0-2.07 1.39-3.87 3.39-4.38 1.47-.38 2.82.16 3.73 1.28.91 1.12 1.57 2.45 2.29 3.91.86 1.76 2.14 3.71 4.7 5.35.36.23.47.71.24 1.07-.18.28-.49.43-.81.43z"/></svg>
                Trending
            </div>
            <div class="sci-sector sec-playlist" onclick="switchTab('playlist', this)">
                <svg viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
                Playlist
            </div>
            <div class="sci-sector sec-download" onclick="switchTab('downloads', this)">
                <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
                Saved
            </div>
        </div>
        <div class="sci-fi-trigger" onclick="toggleSciMenu()">
            <svg style="width:24px;height:24px;fill:#fff;" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
        </div>
    </div>

    <div class="player-bar">
        <div class="player-info-top">
            <span id="nowPlayingText" class="player-title-area">Chagua Wimbo</span>
        </div>
        <audio id="audioPlayer" controls></audio>
    </div>

    <script>
        const audiusHost = "https://discoveryprovider.audius.co";
        let searchTimeout = null;

        function toggleSciMenu() {
            let wheel = document.getElementById('sciWheel');
            wheel.classList.toggle('show');
        }

        function loadHomeData() {
            fetchTrendingForHome();
        }

        async function fetchTrendingForHome() {
            let resultsContainer = document.getElementById('resultsContainer');
            let artsWrapper = document.getElementById('artsWrapper');
            let artsSlider = document.getElementById('artsSlider');

            resultsContainer.innerHTML = "<p style='text-align:center; color: #94a3b8; margin-top: 25px;'>Inapakia...</p>";
            try {
                let response = await fetch(`${audiusHost}/v1/tracks/trending?app_name=XanterMP3`);
                let data = await response.json();
                
                if (data.data && data.data.length > 0) {
                    renderTracks(data.data);

                    artsSlider.innerHTML = "";
                    data.data.forEach(track => {
                        let artworkUrl = track.artwork && track.artwork['480x480'] ? track.artwork['480x480'] : 'https://via.placeholder.com/110';
                        let card = document.createElement('div');
                        card.className = 'art-card';
                        card.innerHTML = `
                            <img src="${artworkUrl}" alt="Art">
                            <div class="art-title">${track.title}</div>
                        `;
                        card.onclick = () => playTrack(track.id, escapeHtmlPlain(track.title), escapeHtmlPlain(track.user.name));
                        artsSlider.appendChild(card);
                    });
                    artsWrapper.style.display = 'block';
                }
            } catch (err) {
                resultsContainer.innerHTML = "<p style='text-align:center; color: #ff5555; margin-top: 25px;'>Imeshindwa kupakia.</p>";
            }
        }

        function switchTab(tab, btnElement) {
            document.querySelectorAll('.sci-sector').forEach(b => b.classList.remove('active'));
            btnElement.classList.add('active');
            toggleSciMenu();

            let searchSection = document.getElementById('searchSection');
            let resultsContainer = document.getElementById('resultsContainer');
            let artsWrapper = document.getElementById('artsWrapper');

            if (tab === 'home') {
                searchSection.style.display = 'block';
                fetchTrendingForHome();
            } else if (tab === 'explore') {
                searchSection.style.display = 'none';
                artsWrapper.style.display = 'none';
                fetchExploreTracks();
            } else if (tab === 'trending') {
                searchSection.style.display = 'none';
                artsWrapper.style.display = 'none';
                fetchTrendingTracks();
            } else if (tab === 'playlist') {
                searchSection.style.display = 'none';
                artsWrapper.style.display = 'none';
                loadPlaylist();
            } else if (tab === 'downloads') {
                searchSection.style.display = 'none';
                artsWrapper.style.display = 'none';
                resultsContainer.innerHTML = "<p style='text-align:center; color: #64748b; margin-top: 25px;'>Tumia kitufe cha 'Download' kilichopo kwenye kila wimbo ili kuhifadhi kwenye simu yako.</p>";
            }
        }

        async function fetchExploreTracks() {
            let resultsContainer = document.getElementById('resultsContainer');
            resultsContainer.innerHTML = "<p style='text-align:center; color: #94a3b8; margin-top: 25px;'>Inatafuta nyimbo za Explore...</p>";
            try {
                let response = await fetch(`${audiusHost}/v1/tracks/search?query=pop&app_name=XanterMP3`);
                let data = await response.json();
                renderTracks(data.data);
            } catch (err) {
                resultsContainer.innerHTML = "<p style='text-align:center; color: #ff5555; margin-top: 25px;'>Imeshindwa kupakia.</p>";
            }
        }

        async function fetchTrendingTracks() {
            let resultsContainer = document.getElementById('resultsContainer');
            resultsContainer.innerHTML = "<p style='text-align:center; color: #94a3b8; margin-top: 25px;'>Inapakia zinazovuma (Trending)...</p>";
            try {
                let response = await fetch(`${audiusHost}/v1/tracks/trending?app_name=XanterMP3`);
                let data = await response.json();
                renderTracks(data.data);
            } catch (err) {
                resultsContainer.innerHTML = "<p style='text-align:center; color: #ff5555; margin-top: 25px;'>Imeshindwa kupakia trending.</p>";
            }
        }

        function renderTracks(tracks) {
            let resultsContainer = document.getElementById('resultsContainer');
            resultsContainer.innerHTML = "";

            if (tracks && tracks.length > 0) {
                tracks.forEach(track => {
                    let artworkUrl = track.artwork && track.artwork['480x480'] ? track.artwork['480x480'] : 'https://via.placeholder.com/48';
                    let trackCard = document.createElement('div');
                    trackCard.className = 'track-card';
                    
                    trackCard.innerHTML = `
                        <div class="track-info">
                            <img src="${artworkUrl}" alt="Cover">
                            <div class="track-details">
                                <h4>${track.title}</h4>
                                <p>${track.user.name}</p>
                            </div>
                        </div>
                        <div class="action-btns">
                            <button class="btn-cheza" title="Cheza" onclick="playTrack('${track.id}', '${escapeHtml(track.title)}', '${escapeHtml(track.user.name)}')">
                                <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                            </button>
                            <button class="btn-playlist" title="Hifadhi Playlist" onclick='saveToPlaylist(${JSON.stringify(track).replace(/'/g, "&quot;")})'>
                                <svg viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
                            </button>
                            <a href="${audiusHost}/v1/tracks/${track.id}/stream?app_name=XanterMP3" download="${track.title}.mp3" target="_blank" style="text-decoration:none;">
                                <button class="btn-download" title="Download">
                                    <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
                                </button>
                            </a>
                        </div>
                    `;
                    resultsContainer.appendChild(trackCard);
                });
            } else {
                resultsContainer.innerHTML = "<p style='text-align:center; color: #94a3b8; margin-top: 25px;'>Hakuna nyimbo zilizopatikana.</p>";
            }
        }

        function saveToPlaylist(track) {
            let playlist = JSON.parse(localStorage.getItem('xanter_playlist')) || [];
            let exists = playlist.some(t => t.id === track.id);
            if (!exists) {
                playlist.push(track);
                localStorage.setItem('xanter_playlist', JSON.stringify(playlist));
                alert("Imeongezwa kwenye Playlist yako!");
            } else {
                alert("Wimbo huu upo tayari kwenye Playlist!");
            }
        }

        function loadPlaylist() {
            let playlist = JSON.parse(localStorage.getItem('xanter_playlist')) || [];
            let resultsContainer = document.getElementById('resultsContainer');
            resultsContainer.innerHTML = "";

            if (playlist.length === 0) {
                resultsContainer.innerHTML = "<p style='text-align:center; color: #64748b; margin-top: 25px;'>Playlist yako ipo tupu. Weka nyimbo kwa kubonyeza kitufe cha ⭐.</p>";
                return;
            }
            renderTracks(playlist);
        }

        function handleSearchInput() {
            clearTimeout(searchTimeout);
            let query = document.getElementById('searchInput').value.trim();
            let suggestionsBox = document.getElementById('suggestionsBox');

            if (query.length < 2) {
                suggestionsBox.style.display = 'none';
                return;
            }

            searchTimeout = setTimeout(async () => {
                try {
                    let response = await fetch(`${audiusHost}/v1/tracks/search?query=${encodeURIComponent(query)}&limit=5&app_name=XanterMP3`);
                    let data = await response.json();
                    suggestionsBox.innerHTML = "";

                    if (data.data && data.data.length > 0) {
                        data.data.forEach(track => {
                            let div = document.createElement('div');
                            div.className = 'suggestion-item';
                            div.innerText = `${track.title} - ${track.user.name}`;
                            div.onclick = () => {
                                document.getElementById('searchInput').value = track.title;
                                suggestionsBox.style.display = 'none';
                                searchTracks();
                            };
                            suggestionsBox.appendChild(div);
                        });
                        suggestionsBox.style.display = 'block';
                    } else {
                        suggestionsBox.style.display = 'none';
                    }
                } catch (e) {
                    suggestionsBox.style.display = 'none';
                }
            }, 300);
        }

        async function searchTracks() {
            let query = document.getElementById('searchInput').value.trim();
            let resultsContainer = document.getElementById('resultsContainer');
            let suggestionsBox = document.getElementById('suggestionsBox');
            let artsWrapper = document.getElementById('artsWrapper');
            
            suggestionsBox.style.display = 'none';
            if (!query) return;

            artsWrapper.style.display = 'none';
            resultsContainer.innerHTML = "<p style='text-align:center; color: #94a3b8; margin-top: 25px;'>Inatafuta nyimbo...</p>";

            try {
                let response = await fetch(`${audiusHost}/v1/tracks/search?query=${encodeURIComponent(query)}&app_name=XanterMP3`);
                let data = await response.json();
                renderTracks(data.data);
            } catch (error) {
                resultsContainer.innerHTML = "<p style='text-align:center; color: #ff5555; margin-top: 25px;'>Imeshindwa kuunganisha na mtandao.</p>";
            }
        }

        function playTrack(trackId, title, artist) {
            let audioPlayer = document.getElementById('audioPlayer');
            let nowPlayingText = document.getElementById('nowPlayingText');
            let streamUrl = `${audiusHost}/v1/tracks/${trackId}/stream?app_name=XanterMP3`;
            
            nowPlayingText.innerText = `Inacheza: ${title} - ${artist}`;
            audioPlayer.src = streamUrl;
            audioPlayer.play().catch(err => {
                console.log("Hitilafu ya uchezaji:", err);
            });
        }

        function escapeHtml(text) {
            return text.replace(/'/g, "\\'").replace(/"/g, '&quot;');
        }

        function escapeHtmlPlain(text) {
            return text.replace(/'/g, "").replace(/"/g, "");
        }

        document.addEventListener('click', function(e) {
            let box = document.getElementById('suggestionsBox');
            let input = document.getElementById('searchInput');
            if (e.target !== box && e.target !== input) {
                box.style.display = 'none';
            }
        });
    </script>
</body>
</html>
