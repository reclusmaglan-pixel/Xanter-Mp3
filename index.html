<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xanter MP3</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header ya App -->
    <div class="xanter-header">
        🎵 XANTER <span>MP3</span>
    </div>

    <!-- Menu za Juu -->
    <div class="xanter-nav-tabs">
        <button class="xanter-tab active">🏠 Home</button>
        <button class="xanter-tab">🧭 Explore</button>
        <button class="xanter-tab">🔥 Trending</button>
        <button class="xanter-tab">👤 Artists</button>
    </div>

    <!-- Sanduku la Kutafutia Online -->
    <div class="xanter-search-wrapper">
        <div class="xanter-search-box">
            <input type="text" id="searchInput" placeholder="Tafuta wimbo au msanii...">
            <button id="searchBtn">🔍</button>
        </div>
    </div>

    <!-- Bango la Kuvutia -->
    <div class="xanter-banner">
        <h2>Discover & Enjoy Your Favorite Music</h2>
        <p>Sikiliza nyimbo mpya, wasanii maarufu na muziki unaoupenda kila siku.</p>
    </div>

    <!-- Sehemu ya Kuonyesha Matokeo -->
    <div id="xanter-online-results"></div>

    <!-- Player ya Chini kabisa -->
    <div class="xanter-player-bar">
        <div class="player-left">
            <div class="player-thumb">🎤</div>
            <div class="player-meta">
                <strong id="currentSongTitle">Chagua Wimbo</strong>
                <span>Xanter MP3</span>
            </div>
        </div>
        <div class="player-controls">
            <button>🔀</button>
            <button>⏮️</button>
            <button class="play-main-btn" onclick="togglePlayPause()">▶</button>
            <button>⏭️</button>
            <button>🔁</button>
        </div>
    </div>

    <!-- JavaScript Mpya ya Haraka na Imara -->
    <script>
        let audioElement = null;

        // Pakia nyimbo za kwanza moja kwa moja ukifungua app
        window.onload = function() {
            tafutaNyimboOnline("popular");
        };

        document.getElementById('searchBtn').addEventListener('click', function() {
            let keyword = document.getElementById('searchInput').value.trim();
            tafutaNyimboOnline(keyword !== "" ? keyword : "popular");
        });

        function tafutaNyimboOnline(query) {
            let resultsDiv = document.getElementById('xanter-online-results');
            resultsDiv.innerHTML = "<p style='color: #9ca3af; text-align: center;'>Inatafuta nyimbo...</p>";

            // Tunatumia Internet Archive Audio API ambayo ni bure na inaaminika
            let url = `https://archive.org/advancedsearch.php?q=${encodeURIComponent(query)} AND mediatype:(audio)&fl[]=identifier,title,creator,downloads&rows=10&page=1&output=json`;

            fetch(url)
                .then(response => response.json())
                .then(data => {
                    resultsDiv.innerHTML = "";
                    let docs = data.response && data.response.docs ? data.response.docs : [];

                    if (docs.length > 0) {
                        docs.forEach(doc => {
                            let title = doc.title || "Wimbo Usio na Jina";
                            let artist = doc.creator || "Xanter Artist";
                            let identifier = doc.identifier;
                            
                            // Link ya moja kwa moja ya kusikiliza na kudownload faili la MP3 kutoka Archive.org
                            let audioUrl = `https://archive.org/download/${identifier}/${identifier}_vbr.mp3`;

                            let item = document.createElement('div');
                            item.className = "xanter-song-row";
                            
                            let cleanName = title.replace(/'/g, "").replace(/"/g, "");
                            let cleanArtist = artist.replace(/'/g, "").replace(/"/g, "");

                            item.innerHTML = `
                                <div class="song-info">
                                    <strong>${cleanName}</strong>
                                    <small>${cleanArtist}</small>
                                </div>
                                <div class="btn-group">
                                    <button class="btn-play" onclick="chezaWimbo('${audioUrl}', '${cleanName}')">Cheza</button>
                                    <button class="btn-dl" onclick="pakuaWimbo('${audioUrl}', '${cleanName}')">Download</button>
                                </div>
                            `;
                            resultsDiv.appendChild(item);
                        });
                    } else {
                        resultsDiv.innerHTML = "<p style='color: #9ca3af; text-align: center;'>Hakuna nyimbo zilizopatikana.</p>";
                    }
                })
                .catch(err => {
                    console.error(err);
                    resultsDiv.innerHTML = "<p style='color: red; text-align: center;'>Imeshindikana kuunganisha na mtandao.</p>";
                });
        }

        function chezaWimbo(audioUrl, songName) {
            if (audioElement) {
                audioElement.pause();
            }
            audioElement = new Audio(audioUrl);
            audioElement.play().catch(e => alert("Imeshindikana kucheza wimbo huu. Jaribu mwingine!"));
            document.getElementById('currentSongTitle').innerText = songName;
        }

        function togglePlayPause() {
            if (audioElement) {
                if (audioElement.paused) {
                    audioElement.play();
                } else {
                    audioElement.pause();
                }
            } else {
                alert("Tafadhali chagua wimbo kwanza!");
            }
        }

        function pakuaWimbo(audioUrl, songName) {
            let a = document.createElement('a');
            a.href = audioUrl;
            a.download = songName + ".mp3";
            a.setAttribute('target', '_blank');
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            alert("Inapakua wimbo: " + songName);
        }
    </script>
</body>
</html>
