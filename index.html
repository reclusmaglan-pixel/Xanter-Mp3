<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xanter MP3</title>
    <!-- FontAwesome kwa ajili ya icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .player-container {
            background: #1e1e1e;
            padding: 25px;
            border-radius: 15px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
        }
        .app-title {
            font-size: 24px;
            margin-bottom: 20px;
            color: #1db954;
        }
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 20px;
        }
        .btn {
            background: #1db954;
            color: white;
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background 0.3s;
        }
        .btn:hover {
            background: #1aa34a;
        }
    </style>
</head>
<body>

    <div class="player-container">
        <h1 class="app-title"><i class="fa-solid fa-music"></i> Xanter MP3</h1>
        <p>Kicheza Muziki Chako</p>
        
        <div class="controls">
            <button class="btn" id="prevBtn"><i class="fa-solid fa-backward"></i></button>
            <button class="btn" id="playBtn"><i class="fa-solid fa-play"></i></button>
            <button class="btn" id="nextBtn"><i class="fa-solid fa-forward"></i></button>
        </div>
    </div>

    <!-- Script ya kusajili Service Worker ili iweze kufanya kazi Offline na PWA -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then((reg) => {
                        console.log('Service Worker imesajiliwa mafanikio:', reg.scope);
                    })
                    .catch((err) => {
                        console.log('Ujasajili wa Service Worker umeshindwa:', err);
                    });
            });
        }
    </script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .then((registration) => {
          console.log('Service Worker imesajiliwa kikamilifu:', registration.scope);
        })
        .catch((error) => {
          console.log('Imeshindwa kusajili Service Worker:', error);
        });
    });
  }
</script>

</body>
</html>
